<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Quote Card｜私人語錄收藏</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#005073">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <!-- 在畫面繪製前先套用主題，避免暗色模式重新整理時閃白 -->
  <script>
    try {
      var t = localStorage.getItem('quote_cards_theme');
      if (!t) t = matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>

  <style>
    /* ============================================================
       亮色主題（預設）
       ============================================================ */

    /* 全站顏色變數：--ink 是主要文字色，--accent 是強調色 */
    :root {
      --ink: #005073;
      --accent: #099bc8;
      --soft: #e9f3f5;
      --line: #bfd4d9;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #fafcfc;
      color: var(--ink);
      font: 14px/1.7 "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }

    button, input, textarea { font: inherit; }
    button { cursor: pointer; }

    /* ---------- 頂部選單 ---------- */
    .menu {
      display: flex;
      min-height: 250px;
      background: linear-gradient(110deg, #e3f1f3, #fff 68%);
      padding: 30px 0;
    }

    .menu_L {
      width: 30%;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
    }

    .menu_L button,
    .menu_L label {
      display: block;
      width: 100%;
      padding: 3px 20px;
      text-align: right;
      color: var(--ink);
      font-weight: 700;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .menu_L button:hover,
    .menu_L label:hover {
      color: var(--accent);
      background: linear-gradient(to left, #fff8, transparent);
    }

    .menu_R {
      width: 70%;
      display: flex;
      align-items: center;
      padding: 30px;
    }

    .header {
      font-size: clamp(38px, 5vw, 68px);
      line-height: 1.1;
      letter-spacing: .2em;
      margin: 0;
    }

    .subtitle {
      letter-spacing: .12em;
      opacity: .7;
      margin-top: 14px;
    }

    /* ---------- TAG 區 ---------- */
    .tag-area {
      width: min(1200px, 92%);
      margin: 24px auto 6px;
      padding: 15px 18px;
      border-bottom: 1px solid var(--line);
    }

    .tag-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .tag-top h2 { margin: 0; font-size: 16px; }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 13px;
    }

    .tag-pill {
      border: 1px solid var(--line);
      border-radius: 30px;
      padding: 5px 13px;
      background: #fff;
      color: var(--ink);
    }

    .tag-pill.active {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }

    .tag-pill:hover { border-color: var(--accent); }

    /* ---------- TAG 管理面板 ---------- */
    .tag-manager {
      margin-top: 15px;
      background: var(--soft);
      padding: 14px;
      border-radius: 9px;
    }

    .tag-manage-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin: 8px 0;
      flex-wrap: wrap;
    }

    .tag-manage-row span { min-width: 100px; }

    .manager-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .tag-manage-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(245px, 1fr));
      gap: 6px 16px;
    }

    .tag-manage-list .tag-manage-row {
      margin: 0;
      padding: 5px 0;
    }

    .tag-manage-list .tag-manage-row span {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    /* ---------- 卡片列表 ---------- */
    .wrap {
      width: min(1200px, 92%);
      margin: 20px auto 70px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 24px;
    }

    .quote-card {
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: rgba(199, 224, 229, .48);
      transition: transform .2s, box-shadow .2s;
    }

    .quote-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px #00334412;
    }

    .card-toolbar {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      border-bottom: 1px dashed #91b9c1;
      padding-bottom: 10px;
      margin-bottom: 15px;
    }

    /* ---------- 按鈕 ---------- */
    .small-btn,
    .primary {
      border: 0;
      border-radius: 5px;
      background: var(--ink);
      color: #fff;
      padding: 5px 12px;
    }

    .small-btn:hover,
    .primary:hover { background: var(--accent); }

    .danger { background: #c45151; }
    .danger:hover { background: #a73b3b; }

    .secondary {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 5px;
      color: var(--ink);
      padding: 5px 12px;
    }

    /* ---------- 卡片內容 ---------- */
    .card-title {
      text-align: center;
      font-size: 21px;
      font-weight: 700;
      letter-spacing: .06em;
      overflow-wrap: anywhere;
    }

    .card-body a {
      color: #2F16A1;                 /* 亮色模式的連結顏色 */
      text-decoration: underline;
      overflow-wrap: anywhere;
    }

    .card-body a:hover { color: #866FEB; }

    .card-body p { margin: .4em 0; }

    .card-body {
      font-size: 15px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      margin: 16px 0 20px;
      line-height: 1.9;
      flex: 1;
    }

    /* 含區塊標籤（p、div、li…）的卡片改用一般換行 */
    .card-body.html-mode { white-space: normal; }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .card-tag {
      font-size: 12px;
      padding: 2px 9px;
      background: #fff9;
      border: 1px solid #bad0d5;
      border-radius: 20px;
    }

    .card-source {
      font-size: 12px;
      opacity: .75;
      margin-top: 12px;
      overflow-wrap: anywhere;
    }

    .muted { opacity: .65; }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 10px;
    }

    /* ---------- 編輯對話框 ---------- */
    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin: 13px 0;
    }

    .field input,
    .field textarea,
    .tag-manager input {
      border: 1px solid var(--line);
      border-radius: 5px;
      padding: 9px;
      background: #fff;
      color: #173e4a;                 /* 亮色模式的輸入框文字色 */
      min-width: 0;
    }

    .field textarea {
      min-height: 180px;
      resize: vertical;
    }

    .check-tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .check-tags label {
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 4px 10px;
      background: #fff;
      cursor: pointer;
    }

    .check-tags input { accent-color: var(--ink); }

    dialog {
      width: min(600px, 94vw);
      max-height: 90vh;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 25px;
      color: var(--ink);
      box-shadow: 0 15px 60px #0003;
    }

    dialog::backdrop { background: #002b3a77; }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
    }

    .note { font-size: 12px; opacity: .7; }

    .footer {
      text-align: center;
      padding: 20px;
      opacity: .6;
    }

    /* ---------- 響應式 ---------- */
    @media (max-width: 1000px) {
      .wrap { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 650px) {
      .menu {
        min-height: 0;
        flex-direction: column-reverse;
        padding: 15px 0;
      }

      .menu_L,
      .menu_R { width: 100%; }

      .menu_L {
        flex-direction: row;
        justify-content: center;
        flex-wrap: wrap;
      }

      .menu_L button,
      .menu_L label {
        width: auto;
        padding: 8px 12px;
        text-align: center;
      }

      .menu_R {
        justify-content: center;
        text-align: center;
        padding: 25px;
      }

      .header { font-size: 42px; }
      .wrap { grid-template-columns: 1fr; }
    }

    /* ============================================================
       暗色主題（只有在 <html data-theme="dark"> 時才生效）
       ============================================================ */

    /* 暗色顏色變數：想整體改字色，優先改這裡的 --ink */
    :root[data-theme=dark] {
      color-scheme: dark;
      --ink: #80aba9;                 /* 主要文字色（標題、一般文字、按鈕文字） */
      --accent: #5cc8ea;              /* 強調色（hover、啟用中的 TAG） */
      --soft: #16323b;                /* TAG 管理面板背景 */
      --line: #2f5560;                /* 邊框線 */
    }

    :root[data-theme=dark] body { background: #0f1c21; }

    :root[data-theme=dark] .menu {
      background: linear-gradient(110deg, #12303a, #0f1c21 68%);
    }

    :root[data-theme=dark] .menu_L button:hover,
    :root[data-theme=dark] .menu_L label:hover {
      background: linear-gradient(to left, #ffffff14, transparent);
    }

    :root[data-theme=dark] .tag-pill,
    :root[data-theme=dark] .secondary,
    :root[data-theme=dark] .check-tags label {
      background: #142a31;
    }

    :root[data-theme=dark] .tag-pill.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #06222b;                 /* 啟用中 TAG 的文字色 */
    }

    :root[data-theme=dark] .quote-card { background: rgba(30, 66, 77, .55); }

    :root[data-theme=dark] .card-toolbar { border-bottom-color: #3d6b78; }

    :root[data-theme=dark] .small-btn,
    :root[data-theme=dark] .primary {
      background: #2c7f99;
      color: #fff;                    /* 一般按鈕文字色 */
    }

    :root[data-theme=dark] .small-btn:hover,
    :root[data-theme=dark] .primary:hover {
      background: var(--accent);
      color: #06222b;                 /* 按鈕 hover 時的文字色 */
    }

    :root[data-theme=dark] .danger { background: #b24545; color: #fff; }
    :root[data-theme=dark] .danger:hover { background: #d05a5a; color: #fff; }

    :root[data-theme=dark] .card-tag {
      background: #ffffff14;
      border-color: #2f5560;
    }

    :root[data-theme=dark] .card-body a { color: #8ec5ff; }        /* 暗色連結色 */
    :root[data-theme=dark] .card-body a:hover { color: #bcdcff; }

    :root[data-theme=dark] .field input,
    :root[data-theme=dark] .field textarea,
    :root[data-theme=dark] .tag-manager input {
      background: #0f1c21;
      color: #80aba9;                 /* 暗色輸入框文字色 */
    }

    :root[data-theme=dark] dialog { background: #12262d; }
  </style>
</head>

<body>
  <!-- 頂部選單 -->
  <header class="menu">
    <nav class="menu_L" aria-label="主選單">
      <button id="exportBtn">Backup</button>
      <label for="importFile">Load</label>
      <input id="importFile" type="file" accept=".txt,.json" hidden>
      <button id="addCardBtn">+ Add</button>
      <button id="themeBtn" type="button">🌙 Dark</button>
    </nav>
    <div class="menu_R">
      <div>
        <h1 class="header">Quote<br>Card</h1>
        <div class="subtitle">私人語錄收藏</div>
      </div>
    </div>
  </header>

  <!-- TAG 篩選與管理 -->
  <section class="tag-area">
    <div class="tag-top">
      <h2>TAG <span id="tagCount" class="muted"></span></h2>
      <button id="manageBtn" class="secondary">⚙ 管理 TAG</button>
    </div>

    <div id="tagFilters" class="tags"></div>

    <div id="tagManager" class="tag-manager" hidden>
      <div class="manager-heading">
        <strong>管理 TAG</strong>
        <button id="closeTagManager" class="secondary" type="button">✕ 關閉</button>
      </div>
      <div class="tag-manage-row">
        <input id="newTag" placeholder="新增 TAG 名稱" maxlength="40">
        <button id="createTag" class="primary">新增</button>
      </div>
      <div id="tagManageList" class="tag-manage-list"></div>
      <p class="note">重新命名會同步更新所有卡片；刪除 TAG 只會移除分類，不會刪除卡片。</p>
    </div>
  </section>

  <!-- 卡片列表（由 app.js 產生） -->
  <main id="cardContainer" class="wrap"></main>

  <footer class="footer">QUOTE CARD · 本機儲存 · 請定期備份</footer>

  <!-- 新增／編輯對話框 -->
  <dialog id="cardDialog">
    <form id="cardForm">
      <h2 id="dialogTitle">新增語錄</h2>

      <div class="field">
        <label for="cardTitle">標題</label>
        <input id="cardTitle" maxlength="200" required placeholder="例如：關於選擇">
      </div>

      <div class="field">
        <label for="cardBody">語錄內容</label>
        <textarea id="cardBody" required placeholder="貼上想珍藏的文字…"></textarea>
      </div>

      <div class="field">
        <label for="cardSource">來源／備註（選填）</label>
        <input id="cardSource" maxlength="500" placeholder="作者、書名或自己的心得">
      </div>

      <div class="field">
        <label>TAG（可複選）</label>
        <div id="editTags" class="check-tags"></div>
      </div>

      <p class="note">支援常用 HTML 排版與安全超連結；純文字網址也會自動轉為連結。內容若不含 HTML 標籤，會原樣顯示（含 &lt;角括號&gt;）。為安全起見不執行腳本。</p>

      <div class="dialog-actions">
        <button type="button" id="cancelDialog" class="secondary">取消</button>
        <button type="submit" class="primary">儲存</button>
      </div>
    </form>
  </dialog>

  <script src="./app.js" defer></script>
</body>
</html>
